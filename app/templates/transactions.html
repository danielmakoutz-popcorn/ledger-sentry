{% extends 'base.html' %}{% block content %}<div class="section-head"><h1>Transactions</h1><a href="/import">Import CSV</a></div><details class="card"><summary>Add one manually</summary><form class="formgrid" action="/transactions/manual" method="post"><input type="date" name="tx_date" value="{{today}}" required><input name="description" placeholder="Description" required><input type="number" step="0.01" name="amount" placeholder="Amount spent" required><select name="category"><option>Food & Dining</option><option>Groceries</option><option>Gas & Auto</option><option>Transport & Travel</option><option>Entertainment</option><option>Subscriptions</option><option>Utilities</option><option>Housing</option><option>Insurance</option><option>Shopping</option><option>Health</option><option>Other</option></select><input name="account" value="Manual"><button>Add</button></form></details><div class="tablewrap"><table><thead><tr><th>Date</th><th>Merchant</th><th>Category</th><th>Account</th><th>Amount</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.tx_date}}</td><td><b>{{r.merchant}}</b><div class="muted small">{{r.description}}</div></td><td>{{r.category}}</td><td>{{r.account}}</td><td class="money">${{'%.2f'|format(r.amount)}}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
